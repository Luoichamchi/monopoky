services:
  co-ca-ngua:
    build: .
    restart: unless-stopped
    init: true # forwards `docker stop` to node instead of waiting 10 s to kill it
    # no published port: cloudflared reaches it as co-ca-ngua:3000 on the compose network, so nothing clashes with the host

  # Cloudflare Tunnel: https://chess.tst.io.vn → co-ca-ngua:3000, no open port on the server (README: "Deploy").
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?put CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - co-ca-ngua
